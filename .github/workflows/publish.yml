name: Publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - chrome-no-sandbox
      - .github/workflows/publish.yml
  pull_request:
    paths:
      - Dockerfile
      - chrome-no-sandbox
      - .github/workflows/publish.yml
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the runner version
        id: version
        run: echo "runner=$(sed -n 's/^ARG RUNNER_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: arc-runner-image:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Chrome and sudo
        run: |
          docker run --rm arc-runner-image:smoke bash -euo pipefail -c '
            test "$(id -un)" = runner
            "$CHROME_PATH" --version
            "$CHROME_PATH" --headless=new --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q "<p>ok</p>"
            sudo env -i apt-get --version > /dev/null
            docker compose version
            zstd --quiet --version
            make --version > /dev/null
            g++ --version > /dev/null
            ls "$RUNNER_TOOL_CACHE"/node/*/x64.complete > /dev/null
            "$RUNNER_TOOL_CACHE"/node/*/x64/bin/node --version
          '

      - name: Tag metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.runner }}
            type=raw,value=${{ steps.version.outputs.runner }}-{{date 'YYYYMMDD'}}.${{ github.run_number }}
            type=sha,prefix=sha-

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
